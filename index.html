<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Identity</title><!-- set by brand.js -->
  <!-- Critical: synchronous layout styles applied before Tailwind CDN processes.
       Without these, the initially-active page reflows when CDN injects its styles,
       causing scroll position bugs (page height changes while user is on it). -->
  <style>
    /* Hide all pages; show only the active one */
    .page { display: none; }
    .page.active { display: block; }
    .cover-page.active { display: flex; }

    /* Establish the flex shell so the active page already has the right
       available width before CDN processes — prevents scroll-breaking reflow */
    body { display: flex; min-height: 100dvh; overflow-x: hidden; }
    .sidebar { width: var(--sidebar-w, 248px); position: fixed; top: 0; left: 0;
               height: 100dvh; z-index: 200; }
    .main { margin-left: var(--sidebar-w, 248px); flex: 1; min-height: 100dvh; }
    .section-content { max-width: 900px; }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'fg-condensed': ['"Founders Grotesk Condensed"', 'sans-serif'],
            'fg':           ['"Founders Grotesk"', 'system-ui', '-apple-system', 'sans-serif'],
            'fg-text':      ['"Founders Grotesk Text"', 'system-ui', '-apple-system', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <style type="text/tailwindcss">
    /* @font-face rules injected by brand.js */

    @layer base {
      :root {
        --sidebar-w:    248px;
        --lh-body:      1.2;
        --lh-headline:  0.9;
        --ease:         cubic-bezier(.4,0,.2,1);
        --nav-hover-bg:  #F5F2EC;
        --nav-active-bg: #EFF5F0;
        --tab-light-shell:       #F1F3F4;
        --tab-light-inactive:    #E4E6E8;
        --tab-light-placeholder: #CCCCCC;
        --tab-light-text:        #1A1A1A;
        --tab-light-text-mid:    #555555;
        --tab-light-text-muted:  #666666;
        --tab-dark-shell:        #2B2B2B;
        --tab-dark-surface:      #3C3C3C;
        --tab-dark-inactive:     #252525;
        --tab-dark-placeholder:  #555555;
        --tab-dark-text:         #F0F0F0;
        --tab-dark-text-muted:   #AAAAAA;
      }
      @media (min-width: 769px) and (max-width: 1024px) {
        :root { --sidebar-w: 200px; }
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; overflow-x: hidden; }
      body {
        font-family: 'Founders Grotesk Text', system-ui, -apple-system, sans-serif;
        background: var(--cream);
        color: var(--charcoal);
        display: flex;
        min-height: 100dvh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      a { text-decoration: none; color: inherit; }
      ul { list-style: none; }
    }


    @layer components {

    /* ─── Accessibility ──────────────────────────────────────── */
    .skip-link {
      background: var(--charcoal);
      color: var(--cream);
      transition: top 0.15s;
      @apply absolute top-[-48px] left-4 px-[18px] py-[10px] text-[14px] font-semibold rounded-b z-[9999] no-underline;
    }
    .skip-link:focus { top: 0; }
    :focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
      border-radius: 2px;
    }
    .nav-link:focus-visible { outline-offset: -2px; }

    /* ─── Mobile header ─────────────────────────────────────── */
    .mobile-header {
      background: var(--cream);
      border-bottom: 1px solid var(--light-gray);
      @apply hidden fixed top-0 left-0 right-0 h-14 items-center justify-between px-5 z-[100];
    }
    .hamburger {
      @apply flex flex-col justify-center gap-[5px] bg-transparent border-0 cursor-pointer p-2 -mr-2;
    }
    .hamburger span {
      background: var(--charcoal);
      @apply block w-[22px] h-[2px] rounded-[1px];
    }
    .sidebar-overlay {
      background: rgba(0, 9, 19, 0.5);
      @apply hidden fixed inset-0 z-[150];
    }
    .sidebar-overlay.open { @apply block; }

    /* ─── Responsive ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      .mobile-header { display: flex; }
      .sidebar-brand { padding: 20px !important; }
      .nav-group-header {
        padding: 12px 20px !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
        cursor: pointer !important;
        user-select: none !important;
      }
      .nav-section-chevron {
        display: block !important;
        width: 16px; height: 16px;
        color: var(--charcoal);
        flex-shrink: 0;
        transition: transform 0.2s ease;
        transform: rotate(-90deg);
      }
      .nav-group.open .nav-section-chevron { transform: rotate(0deg); }
      .nav-group-items {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.25s ease;
      }
      .nav-group.open .nav-group-items { max-height: 800px; }
      .nav-link { padding: 8px 20px !important; }

      .sidebar {
        position: fixed;
        top: 0; bottom: 0; left: 0;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        z-index: 200;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      .sidebar.open { transform: translateX(0); }

      .main {
        margin-left: 0 !important;
        padding-top: 56px;
      }

      .section-content {
        padding: 36px 20px 48px !important;
        max-width: 100% !important;
      }

      .hero { min-height: 260px !important; }

      .resp-grid-2col { grid-template-columns: 1fr !important; }
      .resp-grid-3col { grid-template-columns: 1fr !important; }

      .combo-grid {
        margin-left: 20px !important;
        margin-right: 20px !important;
        grid-template-columns: 1fr !important;
      }

      .resp-inset {
        margin-left: 16px !important;
        margin-right: 16px !important;
      }

      .logo-variations {
        grid-template-columns: repeat(2, 1fr) !important;
      }

      /* ─── Founders Grotesk Overview ─────────────────────────── */
      .fg-overview-grid {
        display: flex !important;
        flex-direction: column !important;
        min-height: calc(100dvh - 56px) !important;
        padding: 24px 20px 40px !important;
      }
      .fg-overview-right    { order: 1; width: 100%; overflow: hidden; }
      .fg-overview-left     { order: 2; margin-top: 24px; width: 100%; box-sizing: border-box; }
      .fg-overview-type     { margin-top: 0 !important; }
      .fg-overview-alpha-row { order: 3; margin-top: auto; padding-top: 32px; }
      .fg-overview-type  { font-size: clamp(44px, 11vw, 72px) !important; margin-top: -0.08em !important; }

      /* ─── Size & Scale ──────────────────────────────────────── */
      .fg-scale-layout {
        display: flex !important;
        flex-direction: column !important;
        gap: 0 !important;
        padding: 24px 20px 48px !important;
      }
      .fg-scale-desc { margin-bottom: 40px; }
      .fg-scale-table-wrap { overflow-x: auto; }
      .fg-scale-table-wrap > div {
        grid-template-columns: 160px 72px 96px 160px 96px !important;
        column-gap: 16px !important;
        min-width: 600px;
      }

      /* ─── What to avoid ─────────────────────────────────────── */
      .type-avoid-layout {
        display: flex !important;
        flex-direction: column !important;
        gap: 0 !important;
        padding: 24px 20px 48px !important;
      }
      .type-avoid-left { margin-bottom: 40px; }
      .type-avoid-examples { overflow-x: auto; }
      .type-avoid-grid { min-width: 360px; }

      /* ─── Intro pages ────────────────────────────────────────── */
      .intro-layout {
        height: calc(100dvh - 56px) !important;
        padding: 20px !important;
      }

      /* ─── Photo grid pages ──────────────────────────────────── */
      .photo-layout {
        display: flex !important;
        flex-direction: column !important;
        gap: 0 !important;
        padding: 24px 20px 48px !important;
      }
      .photo-layout > div:first-child { margin-bottom: 40px; }
      .photo-layout > div:last-child { grid-template-columns: 1fr !important; }

      /* ─── Portrait intro pages (photo-intro, app-intro) ─────── */
      .portrait-intro {
        display: flex !important;
        flex-direction: column !important;
        height: calc(100dvh - 56px) !important;
      }
      .portrait-intro > div:first-child { padding: 20px !important; flex: 1; }
      .portrait-intro > div:last-child { display: none !important; }

      /* ─── H logo mark 2-col ─────────────────────────────────── */
      .hlogo-2col { grid-template-columns: 1fr !important; }

      /* ─── Type usage tables → single column ─────────────────── */
      .type-usage-grid {
        grid-template-columns: 1fr !important;
        margin-left: 20px !important;
        margin-right: 20px !important;
      }
      .type-usage-grid > div { border-right: none !important; }

      /* ─── Swag / In The Wild image grids ────────────────────── */
      .app-img-grid { grid-template-columns: 1fr 1fr !important; }

      /* ─── Prevent root horizontal scroll ───────────────────── */
      html, body { overflow-x: hidden; }

      /* ─── Hero / banner areas ───────────────────────────────── */
      .page > [style*="padding:80px"] {
        padding: 32px 24px !important;
        min-height: 220px !important;
        overflow: hidden !important;
      }
      .page > [style*="padding:80px"] img {
        max-width: 75% !important;
        max-height: 180px !important;
        width: auto !important;
      }
      /* H-logo mark 2-col hero cells */
      .hlogo-2col > div {
        padding: 40px 24px !important;
        min-height: 180px !important;
      }

      /* ─── All inline 2-column grids → single column ─────────── */
      .page [style*="grid-template-columns:1fr 1fr"],
      .page [style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
        gap: 24px !important;
      }

      /* ─── 5-col color combo swatches → 2-col ───────────────── */
      .page [style*="grid-template-columns:repeat(5,1fr)"] {
        grid-template-columns: repeat(2, 1fr) !important;
        align-items: start !important;
      }
      /* Prevent images from blowing past the aspect-ratio:1 cell height */
      .page [style*="grid-template-columns:repeat(5,1fr)"] > div {
        overflow: hidden;
      }
      /* Ensure combo section has bottom padding before page-nav */
      .page > [style*="margin:0 32px 48px"][style*="border-top:1px solid var(--light-gray)"][style*="padding-top:48px"] {
        padding-bottom: 32px !important;
      }

      /* ─── Reduce inset section margins ─────────────────────── */
      .page > [style*="margin:0 32px"] {
        margin-left: 16px !important;
        margin-right: 16px !important;
      }

      /* ─── Page navigation ───────────────────────────────────── */
      .page-nav        { padding: 0 16px !important; margin-top: 48px !important; }
      .page-nav-label  { font-size: 14px !important; }
      .page-nav-dir    { font-size: 10px !important; }
      .page-nav-link   { gap: 4px !important; padding: 20px 0 !important; }

      /* ─── Color palette grids ───────────────────────────────── */
      #primary-palette-grid   { grid-template-columns: 1fr !important; gap: 0 !important; }
      #secondary-palette-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 0 !important; }
      #primary-palette-grid > div,
      #secondary-palette-grid > div { padding: 28px 24px !important; }

      /* ─── Color combinations page (3-col) → 1-col ──────────── */
      .combo-grid { grid-template-columns: 1fr !important; margin: 0 16px 48px !important; }

      /* ─── Photo caption grids ───────────────────────────────── */
      .page [style*="grid-template-columns:1fr 1fr; gap:0 16px"],
      .page [style*="grid-template-columns: 1fr 1fr; gap:0 16px"] {
        grid-template-columns: 1fr !important;
        gap: 16px !important;
      }

      /* ─── Cover seal ────────────────────────────────────────── */
      .cover-seal { height: clamp(90px, 25vw, 130px) !important; }

      /* ─── Info cards (primary-use / min-size boxes) ─────────── */
      .page [style*="border:1px solid var(--light-gray)"][style*="padding:32px"] {
        padding: 20px !important;
      }

      /* ─── Clearspace padding inner boxes ────────────────────── */
      .page [style*="padding:16px 20px"] {
        padding: 12px 14px !important;
      }

      /* ─── color-pathways / app pages – large margin blocks ──── */
      .page > [style*="margin:0 32px 80px"] {
        margin-left: 16px !important;
        margin-right: 16px !important;
      }

      /* ─── 280px+1fr two-col layouts (avatar, type, photo pages) */
      .page > [style*="grid-template-columns:280px 1fr"],
      .page > [style*="grid-template-columns: 280px 1fr"] {
        grid-template-columns: 1fr !important;
        gap: 0 !important;
        padding: 32px 24px 48px !important;
      }

      /* ─── Avatar circles – scale down from 180px ───────────── */
      .page [style*="width:180px"][style*="border-radius:50%"] {
        width: clamp(80px, 22vw, 140px) !important;
        height: clamp(80px, 22vw, 140px) !important;
      }

      /* ─── Favicon size swatches – allow wrapping ────────────── */
      .page [style*="gap:64px"][style*="flex-wrap:wrap"] {
        gap: 32px !important;
      }

      /* ─── Fix #3: Clearspace diagrams ──────────────────────── */
      /* Don't create a scroll container — it causes iOS scroll delay  */
      .cs-outer {
        overflow: visible !important;
        padding: 12px !important;
        touch-action: pan-y;
      }
      /* Scale down large logos inside the diagram */
      .cs-logo-box img { max-width: 100% !important; }

      /* ─── Fix #3: Hero images fill properly ─────────────────── */
      .page > [style*="padding:80px"] img {
        max-width: 70% !important;
        max-height: 160px !important;
      }

      /* ─── Fix #5: Type specimen — size number above specimen ─── */
      .page [style*="align-items:baseline"][style*="flex-wrap:wrap"] {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 6px !important;
      }
      /* Prevent huge display text from overflowing its row */
      .page [style*="font-size:96px"],
      .page [style*="font-size:73px"],
      .page [style*="font-size:64px"],
      .page [style*="font-size:55px"],
      .page [style*="font-size:48px"] {
        font-size: clamp(36px, 12vw, 64px) !important;
      }
      .page [style*="font-size:42px"] { font-size: clamp(28px, 9vw, 42px) !important; }
      .page [style*="font-size:32px"] { font-size: clamp(22px, 7vw, 32px) !important; }
      /* Specimen section container margin */
      .page > [style*="margin:0 32px 80px"] {
        margin-left: 16px !important;
        margin-right: 16px !important;
      }

      /* ─── Fix #4: Color pathways — sticky color name ─────────── */
      .resp-inset { margin: 0 0 48px !important; }
      /* Make pathway color name cells sticky on the left */
      .resp-inset > div > div:nth-child(11n+1):not(:first-child) {
        position: sticky;
        left: 0;
        background: #fff;
        z-index: 2;
        border-right: 1px solid var(--light-gray);
        min-width: 80px;
      }

      /* ─── Fix #6: Size & scale horizontal scroll ─────────────── */
      .fg-scale-layout {
        display: flex !important;
        flex-direction: column !important;
        padding: 24px 0 48px !important;
      }
      .fg-scale-desc { padding: 0 20px; margin-bottom: 32px; }
      .fg-scale-table-wrap {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        padding: 0 16px !important;
      }
    }

    /* ─── Tablet (769–1024px) ───────────────────────────────── */
    @media (min-width: 769px) and (max-width: 1024px) {
      :root { --sidebar-w: 200px; }

      /* Nav */
      .nav-link { font-size: 12px !important; padding: 7px 16px !important; }
      .nav-group-header { padding: 10px 16px 5px !important; font-size: 12px !important; }
      .sidebar-label { font-size: 11px !important; }

      /* Section content */
      .section-content { padding: 32px 24px 48px !important; }

      /* 3-col color grids → 2-col */
      .resp-grid-3col { grid-template-columns: repeat(2, 1fr) !important; }
      .combo-grid { grid-template-columns: repeat(2, 1fr) !important; }

      /* Founders Grotesk overview, tighten bleed text */
      .fg-overview-type { font-size: clamp(60px, 11vw, 130px) !important; }

      /* Type usage tables, compress fixed columns */
      .type-usage-grid { grid-template-columns: 140px 180px 1fr !important; }

      /* Size & scale, tighter gap */
      .fg-scale-layout { gap: 0 40px !important; }

      /* What to avoid, narrower left col, tighter gap */
      .type-avoid-layout {
        grid-template-columns: 200px 1fr !important;
        gap: 0 40px !important;
      }

      /* Photo grid pages */
      .photo-layout {
        grid-template-columns: 200px 1fr !important;
        gap: 0 32px !important;
        padding: 32px 24px 48px !important;
      }

      /* Cover page */
      .cover-title { font-size: clamp(36px, 5.5vw, 80px) !important; }

      /* Inset margins */
      .resp-inset { margin-left: 24px !important; margin-right: 24px !important; }
    }

    /* ─── Small monitor (1025–1280px) ──────────────────────── */
    @media (min-width: 1025px) and (max-width: 1280px) {
      /* 3-col combo grid → 2-col at this size */
      .combo-grid { grid-template-columns: repeat(2, 1fr) !important; }

      /* Tighten section padding */
      .section-content { padding: 40px 32px 56px !important; }

      /* Size & scale, tighter gap */
      .fg-scale-layout { gap: 0 48px !important; }

      /* What to avoid, tighter gap */
      .type-avoid-layout { gap: 0 48px !important; }
    }

    /* ─── Sidebar ────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w);
      height: 100dvh;
      background: var(--white);
      border-right: 1px solid var(--light-gray);
      @apply fixed top-0 left-0 overflow-y-auto overflow-x-hidden z-[200] flex flex-col;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--light-gray); border-radius: 2px; }

    .sidebar-brand {
      border-bottom: 1px solid var(--light-gray);
      @apply p-6 flex-shrink-0;
    }
    .sidebar-wordmark {
      font-family: 'Founders Grotesk Condensed', sans-serif;
      color: var(--green);
      @apply font-black text-[26px] tracking-[0.02em] leading-none block;
    }
    .sidebar-label {
      color: var(--charcoal);
      @apply text-[11px] font-medium tracking-[0.12em] uppercase mt-[5px];
    }

    .nav-group {
      border-bottom: 1px solid var(--light-gray);
      @apply py-[14px];
    }
    .nav-group-header {
      color: var(--charcoal);
      @apply text-[11px] font-semibold tracking-[0.13em] uppercase px-6 pb-2;
    }
    .nav-section-chevron { @apply hidden; }
    .nav-link {
      color: var(--charcoal);
      border-left: 3px solid transparent;
      transition: background 0.12s var(--ease), color 0.12s var(--ease), border-color 0.12s var(--ease);
      @apply block py-2 px-6 text-[13px] font-normal cursor-pointer;
    }
    .nav-link:hover { background: var(--nav-hover-bg); color: var(--green); }
    .nav-link.active {
      border-left-color: var(--green);
      color: var(--green);
      background: var(--nav-active-bg);
      @apply font-medium;
    }

    /* ─── Collapsible nav sub-sections ──────────────────────── */
    .nav-expandable { @apply relative; }
    .nav-parent { @apply flex justify-between items-center; }
    .nav-chevron {
      color: currentColor;
      transition: transform 0.18s ease;
      transform: rotate(-90deg);
      @apply flex-shrink-0 w-[14px] h-[14px] mr-[2px] cursor-pointer;
    }
    .nav-expandable.open > .nav-parent .nav-chevron { transform: rotate(0deg); }
    .nav-sub {
      max-height: 0;
      transition: max-height 0.22s ease;
      @apply overflow-hidden;
    }
    .nav-sub.open { max-height: 500px; }
    .nav-child { padding-left: 36px !important; font-size: 12px !important; }

    /* ─── Main ───────────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      min-height: 100dvh;
      @apply flex-1;
    }

    /* ─── Pages ──────────────────────────────────────────────── */
    .page { @apply hidden; }
    .page[id] { outline: none; }
    .page.active { @apply block; }

    /* ─── Bottom page navigation ─────────────────────────────── */
    .page-nav {
      border-top: 1px solid var(--light-gray);
      @apply flex justify-between items-stretch px-12 mt-12;
    }
    .page-nav-link {
      color: var(--charcoal);
      transition: color 0.15s var(--ease);
      @apply flex flex-col gap-[6px] py-7 no-underline max-w-[45%];
    }
    .page-nav-link:hover { color: var(--green); }
    .page-nav-link:hover .page-nav-dir { color: var(--green); }
    .page-nav-dir {
      color: var(--warm-gray);
      transition: color 0.15s var(--ease);
      @apply text-[11px] font-semibold tracking-[0.1em] uppercase;
    }
    .page-nav-label {
      font-family: 'Founders Grotesk', sans-serif;
      @apply text-[17px] font-medium leading-[1.1];
    }
    .page-nav-next { @apply text-right items-end; }

    /* ─── Hero ───────────────────────────────────────────────── */
    .hero {
      @apply w-full min-h-[500px] flex items-center justify-center relative overflow-hidden;
    }
    .hero--green    { background: var(--green); }
    .hero--teal     { background: var(--teal); }
    .hero--charcoal { background: var(--charcoal); }
    .hero--white    { background: var(--white); }
    .hero--cream    { background: var(--cream); }
    .hero--blue     { background: var(--blue); }
    .hero--yellow   { background: var(--yellow); }
    .hero--purple   { background: var(--purple); }

    .hero--split {
      @apply grid min-h-[440px];
      grid-template-columns: 1fr 1fr;
    }
    .hero-half {
      @apply flex items-center justify-center p-[60px];
    }

    /* ─── Content ────────────────────────────────────────────── */
    .section-content {
      @apply pt-[72px] px-8 pb-[80px] max-w-[900px];
    }
    .section-label {
      color: var(--charcoal);
      @apply text-[11px] font-semibold tracking-[0.13em] uppercase mb-[14px];
    }
    .section-title {
      font-family: 'Founders Grotesk', sans-serif;
      color: var(--charcoal);
      @apply font-semibold text-[34px] leading-none mb-7;
    }
    .section-body {
      color: var(--charcoal);
      line-height: var(--lh-body);
      @apply text-[18px];
    }
    .section-body p + p { margin-top: 18px; }
    .section-body strong { font-weight: 600; color: var(--charcoal); }

    /* ─── Pull Quote ─────────────────────────────────────────── */
    .pull-quote {
      font-family: 'Founders Grotesk', sans-serif;
      color: var(--green);

    /* ─── Wordmark Display ───────────────────────────────────── */

      color: var(--white);
      font-size: clamp(80px, 16vw, 200px);

    .wordmark-hero-text--teal   { color: var(--teal); }
    .wordmark-hero-text--dark   { color: var(--charcoal); }
    .wordmark-hero-text--white  { color: var(--white); }

    /* ─── Icon SVG ───────────────────────────────────────────── */
    .icon-display {
      @apply flex items-center justify-center;
    }
    .icon-display svg {
      @apply w-full h-full max-w-[260px] max-h-[260px];
    }

    /* ─── Color Modes Grid ───────────────────────────────────── */
    .color-modes {
      background: var(--light-gray);
      @apply grid gap-[2px];
      grid-template-columns: repeat(4, 1fr);
    }
    .color-mode-cell {
      @apply flex flex-col items-start gap-6 px-8 py-12;
    }
    .color-mode-label {
      @apply text-[11px] font-medium tracking-[0.08em] uppercase mt-auto;

    .color-mode-wordmark {

      line-height: var(--lh-headline);

    /* ─── 5-col combo grids: prevent last-row single item from
         stretching taller than aspect-ratio:1 dictates ──────── */
    .page [style*="grid-template-columns:repeat(5,1fr)"] {
      align-items: start;
    }

    /* ─── Color Swatches ─────────────────────────────────────── */
    .color-hero-strip {
      @apply flex h-full min-h-[500px];

    .swatches {
      @apply grid gap-6 mt-12;

    .swatch-block {

    .swatch-name {
      color: var(--charcoal);
      @apply font-semibold text-[14px] mb-1;

    .swatch-values {
      color: var(--charcoal);
      font-variant-numeric: tabular-nums;

    }

    .secondary-swatches {
      background: var(--light-gray);
      @apply flex gap-[2px] mt-12 rounded-[2px] overflow-hidden;
    }
    .secondary-swatch {
      @apply flex-1 flex flex-col justify-end min-h-[200px] pt-10 px-6 pb-7;
    }
    .secondary-swatch-name {
      @apply text-[12px] font-semibold tracking-[0.06em] uppercase;
    }
    .secondary-swatch-hex {
      @apply text-[11px] mt-[2px];

    /* ─── Type Specimen ──────────────────────────────────────── */
    .type-hero {
      background: var(--charcoal);
      @apply flex flex-col items-start justify-center p-[80px] gap-0;
    }
    .type-sample-xl {
      font-family: 'Founders Grotesk Condensed', sans-serif;

    .type-sample-lg {

    .type-sample-body {

    .type-table {

    .type-table tr {
      border-bottom: 1px solid var(--light-gray);
    }
    .type-table th {
      color: var(--charcoal);
      @apply text-left text-[11px] font-semibold tracking-[0.1em] uppercase pb-3;

    .type-table td {

    .type-specimen-cell { @apply pr-6; }

    /* ─── Imagery Principles ─────────────────────────────────── */
    .imagery-grid {
      background: var(--light-gray);
      @apply grid gap-[2px] mt-10;
      grid-template-columns: repeat(2, 1fr);
    }
    .imagery-item {
      background: var(--white);

    .imagery-icon {

    .imagery-heading {

      @apply font-semibold text-[15px] mb-2;
    }
    .imagery-desc {
      color: var(--charcoal);
      @apply text-[13px] leading-[1.2];
    }

    /* ─── Applications Overview ──────────────────────────────── */
    .app-grid {
      background: var(--light-gray);
      @apply grid gap-[2px] mt-10;
      grid-template-columns: repeat(3, 1fr);
    }
    .app-item {
      background: var(--cream);

    .app-context {
      color: var(--charcoal);
      @apply text-[11px] font-semibold tracking-[0.12em] uppercase mb-3;
    }
    .app-name {
      font-family: 'Founders Grotesk', sans-serif;
      color: var(--charcoal);

    .app-desc {

    }
    .app-mark {

    /* ─── Municipalities Callout ─────────────────────────────── */
    .municipalities {
      background: var(--green);
      @apply py-[60px] px-8;
    }
    .municipalities-label {
      color: var(--white);
      @apply text-[11px] font-semibold tracking-[0.13em] uppercase mb-8;
    }
    .municipalities-grid {

      grid-template-columns: repeat(4, 1fr);
    }
    .municipality {
      font-family: 'Founders Grotesk Condensed', sans-serif;
      color: var(--white);
      border-top: 1px solid rgba(255,255,255,0.2);
      @apply font-bold text-[18px] tracking-[0.03em] py-[10px] uppercase;
    }
    .municipality-num {
      color: var(--teal);
      @apply text-[11px] font-normal block mb-[2px];
    }

    /* ─── System diagram ─────────────────────────────────────── */
    .system-diagram {
      background: var(--white);
      @apply flex items-center justify-center gap-12 p-[80px] flex-wrap;
    }
    .system-element {
      @apply flex flex-col items-center gap-4;
    }
    .system-element-label {
      color: var(--charcoal);
      @apply text-[11px] font-semibold tracking-[0.1em] uppercase;
    }

    /* ─── Full-width statement ───────────────────────────────── */
    .statement-block {
      background: var(--teal);
      @apply flex items-center min-h-[320px] p-[80px];
    }
    .statement-text {
      font-family: 'Founders Grotesk Condensed', sans-serif;
      color: var(--charcoal);
      font-size: clamp(28px, 4vw, 52px);
      @apply font-bold leading-none max-w-[800px] tracking-[-0.01em];
    }
    .statement-text em {
      font-style: italic;
      font-weight: 300;
    }

    /* ─── Final section ──────────────────────────────────────── */

    /* ─── Utilities ──────────────────────────────────────────── */

    .text-teal    { color: var(--teal) !important; }

    @media (max-width: 768px) {

        padding: 20px;
      }

    }

        min-height: calc(100dvh - 56px) !important;
      }

        align-items: flex-end;
      }

        height: clamp(90px, 28vw, 140px) !important;
      }

    /* ─── Clearspace Diagram Component ──────────────────────────
       Reusable for any logo page. Set --cs-x on .cs-zone to
       control the clearspace amount. Copy the .cs-outer block
       and swap the logo src and definition text.
    ─────────────────────────────────────────────────────────── */
    .cs-outer {
      border: 1px solid var(--light-gray);
      @apply flex flex-col items-center p-10 w-full box-border;
    }
    .cs-zone {
      background: color-mix(in srgb, var(--teal) 20%, transparent);
      padding: var(--cs-x, 36px);
      @apply relative inline-block;
    }
    .cs-logo-box {
      background: var(--white);
      @apply flex items-center justify-center relative;
    }
    /* H mark in the bottom clearspace strip — height = --cs-x exactly.
       H_black.svg path fills the full viewBox, so no scaling correction needed. */
    .cs-h-mark {
      position: absolute;
      height: var(--cs-x, 32px);
      width: auto;
      opacity: 0.25;
      pointer-events: none;
    }
    /* Vertical dimension lines (top / bottom clearspace strips) */
    .cs-dim-v {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: var(--cs-x, 36px);
      background: color-mix(in srgb, var(--charcoal) 30%, transparent);
    }
    .cs-dim-v.top    { top: 0; }
    .cs-dim-v.bottom { bottom: 0; }
    /* Horizontal dimension lines (left / right clearspace strips) */
    .cs-dim-h {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      height: 1px;
      width: var(--cs-x, 36px);
      background: color-mix(in srgb, var(--charcoal) 30%, transparent);
    }
    .cs-dim-h.left  { left: 0; }
    .cs-dim-h.right { right: 0; }
    /* Tick marks via pseudo-elements */
    .cs-dim-v::before, .cs-dim-v::after {
      content: '';
      position: absolute;
      left: -4px;
      width: 9px;
      height: 1px;
      background: color-mix(in srgb, var(--charcoal) 30%, transparent);
    }
    .cs-dim-v::before { top: 0; }
    .cs-dim-v::after  { bottom: 0; }
    .cs-dim-h::before, .cs-dim-h::after {
      content: '';
      position: absolute;
      top: -4px;
      height: 9px;
      width: 1px;
      background: color-mix(in srgb, var(--charcoal) 30%, transparent);
    }
    .cs-dim-h::before { left: 0; }
    .cs-dim-h::after  { right: 0; }
    /* Dimension labels */
    .cs-dim-v .cs-lbl {
      position: absolute;
      top: 50%;
      left: 7px;
      transform: translateY(-50%);
      font-family: 'Founders Grotesk', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: var(--charcoal);
      line-height: 1;
    }
    .cs-dim-h .cs-lbl {
      position: absolute;
      left: 50%;
      bottom: 6px;
      transform: translateX(-50%);
      font-family: 'Founders Grotesk', sans-serif;
      font-weight: 700;
      font-size: 11px;
      color: var(--charcoal);
      line-height: 1;
    }
    /* Definition row under the diagram */
    .cs-def {
      font-family: 'Founders Grotesk Text', sans-serif;
      color: var(--charcoal);
      @apply flex items-center gap-2 pt-[14px] text-[12px];
    }
    .cs-def-x {
      font-family: 'Founders Grotesk', sans-serif;
      background: color-mix(in srgb, var(--teal) 50%, transparent);
      color: var(--charcoal);
      @apply font-bold text-[11px] py-[2px] px-[7px] rounded-[2px] flex-shrink-0;
    }

    /* ─── Masonry photo grid ─────────────────────────────────── */
    .masonry-grid {
      columns: 3;
      column-gap: 10px;
    }
    .masonry-grid img,
    .masonry-grid .masonry-placeholder {
      width: 100%;
      display: block;
      break-inside: avoid;
      margin-bottom: 10px;
    }
    .masonry-grid img { height: auto; }
    .masonry-grid .masonry-placeholder {
      aspect-ratio: 16/9;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--charcoal);
      opacity: 0.9;
    }
    .masonry-grid .masonry-placeholder span { opacity: 0.3; }

    @media (max-width: 1439px) {
      .masonry-grid { columns: 2; }
    }

    } /* end @layer components */

<!-- ══════════════════════════════════════════════════════════
     JAVASCRIPT, Scroll-driven nav + smooth scroll
══════════════════════════════════════════════════════════════ -->
<script src="brand.js?v=8"></script>

<script>
(function () {
  const links = document.querySelectorAll('.nav-link[data-target]');
  const validIds = new Set([...links].map(l => l.getAttribute('data-target')));
  validIds.add('home');
  const sidebar = document.querySelector('.sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const hamburger = document.getElementById('hamburger');

  // Collapsible nav groups
  const fgChildIds = new Set(['fg-overview','fg-usage','fg-specimen','fg-scale']);
  const fgGroup = document.getElementById('nav-fg-group');
  const fgSub   = document.getElementById('nav-fg-sub');

  function setFgExpanded(open) {
    if (!fgGroup || !fgSub) return;
    fgGroup.classList.toggle('open', open);
    fgSub.classList.toggle('open', open);
    const parent = fgGroup.querySelector('.nav-parent');
    if (parent) parent.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  const fullLogoChildIds = new Set(['logo-horizontal','logo-stacked','logo-text-only']);
  const fullLogoGroup = document.getElementById('nav-full-logo-group');
  const fullLogoSub   = document.getElementById('nav-full-logo-sub');

  function setFullLogoExpanded(open) {
    if (!fullLogoGroup || !fullLogoSub) return;
    fullLogoGroup.classList.toggle('open', open);
    fullLogoSub.classList.toggle('open', open);
    const parent = fullLogoGroup.querySelector('.nav-parent');
    if (parent) parent.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  const hcnjChildIds = new Set(['hcnj-horizontal','hcnj-text-lockup','hcnj-text-only']);
  const hcnjGroup = document.getElementById('nav-hcnj-group');
  const hcnjSub   = document.getElementById('nav-hcnj-sub');

  function setHcnjExpanded(open) {
    if (!hcnjGroup || !hcnjSub) return;
    hcnjGroup.classList.toggle('open', open);
    hcnjSub.classList.toggle('open', open);
    const parent = hcnjGroup.querySelector('.nav-parent');
    if (parent) parent.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  const landscapeChildIds = new Set(['photo-landscape-examples','photo-landscape-dos','photo-landscape-donts']);
  const landscapeGroup = document.getElementById('nav-landscape-group');
  const landscapeSub   = document.getElementById('nav-landscape-sub');

  function setLandscapeExpanded(open) {
    if (!landscapeGroup || !landscapeSub) return;
    landscapeGroup.classList.toggle('open', open);
    landscapeSub.classList.toggle('open', open);
    const parent = landscapeGroup.querySelector('.nav-parent');
    if (parent) parent.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  const communityPhotoChildIds = new Set(['photo-community-examples','photo-community-dos','photo-community-donts']);
  const communityPhotoGroup = document.getElementById('nav-community-photo-group');
  const communityPhotoSub   = document.getElementById('nav-community-photo-sub');

  function setCommunityPhotoExpanded(open) {
    if (!communityPhotoGroup || !communityPhotoSub) return;
    communityPhotoGroup.classList.toggle('open', open);
    communityPhotoSub.classList.toggle('open', open);
    const parent = communityPhotoGroup.querySelector('.nav-parent');
    if (parent) parent.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  }

  function showPage(targetId, pushState) {
    if (!validIds.has(targetId)) targetId = 'home';
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const page = document.getElementById(targetId);
    if (page) page.classList.add('active');
    links.forEach(l => l.classList.remove('active'));
    const activeLink = document.querySelector('.nav-link[data-target="' + targetId + '"]');
    if (activeLink) activeLink.classList.add('active');
    // Auto-expand groups when any child page is active
    if (fgChildIds.has(targetId)) setFgExpanded(true);
    if (fullLogoChildIds.has(targetId)) setFullLogoExpanded(true);
    if (hcnjChildIds.has(targetId)) setHcnjExpanded(true);
    if (landscapeChildIds.has(targetId)) setLandscapeExpanded(true);
    if (communityPhotoChildIds.has(targetId)) setCommunityPhotoExpanded(true);
    // On mobile, open the section containing the active nav link
    if (window.innerWidth <= 768) {
      const activeNavLink = document.querySelector('.nav-link[data-target="' + targetId + '"]');
      if (activeNavLink) {
        const section = activeNavLink.closest('.nav-group');
        if (section) {
          document.querySelectorAll('.nav-group').forEach(g => {
            g.classList.remove('open');
            const h = g.querySelector('.nav-group-header[role="button"]');
            if (h) h.setAttribute('aria-expanded', 'false');
          });
          section.classList.add('open');
          const h = section.querySelector('.nav-group-header[role="button"]');
          if (h) h.setAttribute('aria-expanded', 'true');
        }
      }
    }
    window.scrollTo(0, 0);
    if (pushState) history.pushState({ page: targetId }, '', '#' + targetId);
    document.body.classList.toggle('on-home', targetId === 'home');
    const mLogo = document.getElementById('mobile-logo');
    if (mLogo) mLogo.src = BRAND.meta.sidebarLogoImage;
    closeSidebar();
  }

  links.forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      const target = link.getAttribute('data-target');
      // Clicking a parent nav link toggles that group AND navigates
      if (target === 'fg-overview') {
        const isOpen = fgGroup && fgGroup.classList.contains('open');
        setFgExpanded(!isOpen);
      }
      if (target === 'logo-horizontal') {
        const isOpen = fullLogoGroup && fullLogoGroup.classList.contains('open');
        setFullLogoExpanded(!isOpen);
      }
      if (target === 'hcnj-horizontal') {
        const isOpen = hcnjGroup && hcnjGroup.classList.contains('open');
        setHcnjExpanded(!isOpen);
      }
      if (target === 'photo-landscape-examples') {
        const isOpen = landscapeGroup && landscapeGroup.classList.contains('open');
        setLandscapeExpanded(!isOpen);
      }
      if (target === 'photo-community-examples') {
        const isOpen = communityPhotoGroup && communityPhotoGroup.classList.contains('open');
        setCommunityPhotoExpanded(!isOpen);
      }
      showPage(target, true);
    });
  });

  // Chevron-only click: toggle without navigating
  document.querySelectorAll('.nav-chevron').forEach(chevron => {
    chevron.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const expandable = chevron.closest('.nav-expandable');
      if (!expandable) return;
      if (expandable.id === 'nav-fg-group') {
        setFgExpanded(!fgGroup.classList.contains('open'));
      } else if (expandable.id === 'nav-full-logo-group') {
        setFullLogoExpanded(!fullLogoGroup.classList.contains('open'));
      } else if (expandable.id === 'nav-hcnj-group') {
        setHcnjExpanded(!hcnjGroup.classList.contains('open'));
      } else if (expandable.id === 'nav-landscape-group') {
        setLandscapeExpanded(!landscapeGroup.classList.contains('open'));
      } else if (expandable.id === 'nav-community-photo-group') {
        setCommunityPhotoExpanded(!communityPhotoGroup.classList.contains('open'));
      }
    });
  });

  // ── Bottom prev/next navigation ──────────────────────────────
  (function buildPageNav() {
    const pages = [];
    BRAND.nav.forEach(section => {
      const groupLabel = section.group.replace(/&amp;/g, '&');
      section.items.forEach(item => {
        if (item.children) {
          item.children.forEach(child => pages.push({ id: child.id, label: child.label, group: groupLabel }));
        } else {
          pages.push({ id: item.id, label: item.label, group: groupLabel });
        }
      });
    });

    pages.forEach((page, i) => {
      const el = document.getElementById(page.id);
      if (!el) return;
      const prev = pages[i - 1];
      const next = pages[i + 1];
      if (!prev && !next) return;

      const nav = document.createElement('nav');
      nav.className = 'page-nav';
      nav.setAttribute('aria-label', 'Page navigation');

      let html = prev
        ? `<a class="page-nav-link page-nav-prev" href="#${prev.id}" data-target="${prev.id}">
             <span class="page-nav-dir">← Previous</span>
             <span class="page-nav-label">${prev.label}</span>
           </a>`
        : '<span></span>';

      if (next) {
        html += `<a class="page-nav-link page-nav-next" href="#${next.id}" data-target="${next.id}">
                   <span class="page-nav-dir">Next →</span>
                   <span class="page-nav-label">${next.label}</span>
                 </a>`;
      }

      nav.innerHTML = html;
      el.appendChild(nav);

      nav.querySelectorAll('a[data-target]').forEach(a => {
        a.addEventListener('click', e => {
          e.preventDefault();
          showPage(a.getAttribute('data-target'), true);
        });
      });
    });
  })();

  const navHome = document.getElementById('nav-home');
  if (navHome) navHome.addEventListener('click', (e) => { e.preventDefault(); showPage('home', true); });

  const mobileLogo = document.getElementById('mobile-logo');
  if (mobileLogo) mobileLogo.addEventListener('click', () => showPage('home', true));

  if (hamburger) hamburger.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
  });
  if (overlay) overlay.addEventListener('click', closeSidebar);

  window.addEventListener('popstate', (e) => {
    const id = e.state && e.state.page ? e.state.page : (location.hash.slice(1) || 'home');
    showPage(id, false);
  });

  const initial = location.hash.slice(1) || 'home';
  showPage(initial, true);
})();
</script>

</body>
